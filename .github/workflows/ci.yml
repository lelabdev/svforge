name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the previous run (#413): daily
# development stays fast instead of queueing redundant pipelines.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast guards that ALWAYS run (pull requests and pushes). No PostgreSQL, no
  # scaffold, no user journey: the heavy battery gates the release instead
  # (#413). These steps must stay cheap enough to run on every commit.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Repository quality gates (#351) — ALL BLOCK MERGING:
      #   lint       (eslint)  repository source, tests, scripts
      #   typecheck  (tsc)     strict, incl. test files
      #   audit      (OSV.dev) bun.lock vulnerabilities; retries transient
      #                        network errors 3x, then FAILS (never passes
      #                        silently on an unverified dependency tree)
      - name: Lint (eslint)
        run: bun run lint

      - name: Typecheck (tsc)
        run: bun run typecheck

      - name: Dependency audit (OSV)
        run: bun run audit

      # Better Auth ships in generated projects, not in this repo's lockfile,
      # so the repository audit above cannot see it. Resolve the PINNED stack in
      # a scratch project and audit its full closure (#319, #460).
      - name: Better Auth stack audit
        run: |
          PIN=$(node --input-type=module -e "import { currentPin } from './scripts/better-auth-upgrade.mjs'; console.log(currentPin().version)")
          AUDIT_DIR="$(mktemp -d)"
          cd "$AUDIT_DIR"
          echo '{ "name": "better-auth-stack-audit", "private": true }' > package.json
          bun add "better-auth@$PIN" >/dev/null
          cd "$GITHUB_WORKSPACE"
          node scripts/better-auth-audit.mjs "$AUDIT_DIR/bun.lock"

      # Generated-manifest freshness gate (#329): regenerate every manifest on
      # the clean checkout and fail on any diff BEFORE the build step can
      # regenerate over it and hide the drift.
      - name: Check generated manifests freshness
        run: node scripts/check-generated.mjs

      - name: Build all packages
        run: bun run --filter '*' build

      - name: Run tests
        run: bun x vitest run --no-file-parallelism

  # Optional reusable Docker builder (#606). Its only inputs are the pinned
  # lockfile, the dashboard manifest it is generated from, and the Dockerfile,
  # so it runs when one of those changes instead of on every PR. The job builds
  # the image and executes docker/builder-smoke.sh: manifest+lockfile identity,
  # a no-op frozen install, and real Bun imports of the preinstalled stack.
  docker-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Pull requests diff against their base; pushes diff the pushed range
      # (`github.event.before`..`github.sha`). Both paths classify the changed
      # files with scripts/docker-builder-changed.mjs, so a documentation-only
      # push to main or dev does not rebuild the ~1.1 GB image.
      - name: Detect builder inputs
        id: changes
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.base_ref }}"
            git fetch --no-tags origin "+refs/heads/$base:refs/remotes/origin/$base"
            base_ref="origin/$base"
            head_ref="HEAD"
          else
            head_ref="${{ github.sha }}"
            base_ref="${{ github.event.before }}"
            # A brand-new branch reports an all-zero `before`: there is no range
            # to classify, so validate the builder instead of skipping it.
            if ! git cat-file -e "${base_ref}^{commit}" 2>/dev/null; then
              base_ref="$(git rev-parse "${head_ref}^" 2>/dev/null || true)"
            fi
          fi
          if [ -z "$base_ref" ]; then
            changed=true
          else
            changed="$(node scripts/docker-builder-changed.mjs --base "$base_ref" --head "$head_ref")"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Builder inputs changed: $changed"

      - name: Build and smoke the reusable builder image
        if: steps.changes.outputs.changed == 'true'
        run: bash docker/builder-smoke.sh

  # One representative scaffold after a merge to `main` (#413): catches a
  # fundamental composition break between releases without replaying the full
  # matrix on every merge. `base` does not need PostgreSQL.
  main-smoke:
    needs: quality
    # Keep the post-merge smoke visible even if an unrelated quality test fails.
    # !cancelled() waits for quality while allowing this job after its failure.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Scaffold test (base)
        run: bash scripts/test-scaffold.sh base
