name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # PostgreSQL service for real DB scaffolds (#255): dashboard and
    # dashboard-foundations run drizzle-kit push against this instance.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sf_dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Repository quality gates (#351) — ALL THREE BLOCK MERGING:
      #   lint       (eslint)  repository source, tests, scripts
      #   typecheck  (tsc)     strict, incl. test files; scaffold templates
      #                        stay covered by the scaffold tests
      #   audit      (OSV.dev) bun.lock vulnerabilities; retries transient
      #                        network errors 3x, then FAILS (never passes
      #                        silently on an unverified dependency tree)
      - name: Lint (eslint)
        run: bun run lint

      - name: Typecheck (tsc)
        run: bun run typecheck

      - name: Dependency audit (OSV)
        run: bun run audit

      # Better Auth ships in generated projects, not in this repo's lockfile,
      # so the repository audit above cannot see it. Resolve the PINNED stack in
      # a scratch project and audit its full closure (#319, #460). This — plus
      # the `Scaffold test (dashboard)` schema/runtime gate below — is how an
      # intentional Better Auth bump is validated now that there is no
      # dedicated dependency bot.
      - name: Better Auth stack audit
        run: |
          PIN=$(node --input-type=module -e "import { currentPin } from './scripts/better-auth-upgrade.mjs'; console.log(currentPin().version)")
          AUDIT_DIR="$(mktemp -d)"
          cd "$AUDIT_DIR"
          echo '{ "name": "better-auth-stack-audit", "private": true }' > package.json
          bun add "better-auth@$PIN" >/dev/null
          cd "$GITHUB_WORKSPACE"
          node scripts/better-auth-audit.mjs "$AUDIT_DIR/bun.lock"

      # Generated-manifest freshness gate (#329): regenerate every manifest on
      # the clean checkout and fail on any diff BEFORE the build step can
      # regenerate over it and hide the drift.
      - name: Check generated manifests freshness
        run: node scripts/check-generated.mjs

      - name: Build all packages
        run: bun run --filter '*' build

      - name: Run tests
        run: bun x vitest run --no-file-parallelism

      - name: Scaffold test (base)
        run: bash scripts/test-scaffold.sh base

      - name: Scaffold test (dashboard)
        run: bash scripts/test-scaffold.sh dashboard

      - name: Scaffold test (dashboard + playwright)
        run: bash scripts/test-scaffold.sh dashboard-playwright

      - name: Scaffold test (base + blog)
        run: bash scripts/test-scaffold.sh base-blog

      - name: Scaffold test (base + module composition)
        run: bash scripts/test-scaffold.sh base-modules

      # Permanent composition of the new foundations (#258): dashboard +
      # audit + notifications + jobs + chat + realtime against real PostgreSQL.
      - name: Scaffold test (dashboard-foundations)
        run: bash scripts/test-scaffold.sh dashboard-foundations

      # Consumer coverage of the historical modules (#284): UI modules on a
      # real base scaffold, integrations on a real dashboard with PostgreSQL.
      - name: Scaffold test (base-ui-modules)
        run: bash scripts/test-scaffold.sh base-ui-modules

      - name: Scaffold test (dashboard-integrations)
        run: bash scripts/test-scaffold.sh dashboard-integrations
        env:
          CI: 'true'

      # One-command project creator (#417): the real `svforge create` bin
      # end-to-end (plan → sv create → grouped sv add → doctor + check).
      - name: Scaffold test (create-cli)
        run: bash scripts/test-scaffold.sh create-cli
        env:
          CI: 'true'

      # External user journey (#462, hardened in #465): acquire `sv` from the
      # registry, pack the current build, and complete the real install path
      # (base + dashboard) against the PostgreSQL service — BEFORE merge, so a
      # broken journey harness is caught in review, not during a release.
      - name: User journey smoke test (local package)
        run: bash scripts/test-user-journey.sh
        env:
          CI: 'true'
