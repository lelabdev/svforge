name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  # #656: the scope measurement needs BOTH policies on the SAME commit, which a
  # PR event cannot provide (labels are snapshotted when the run is created).
  # Dispatch this workflow twice on one branch tip with scope=full and
  # scope=targeted to compare complete vs scoped work on an identical SHA.
  workflow_dispatch:
    inputs:
      scope:
        description: 'Measurement only: full validation, or affected scoping (targeted)'
        type: choice
        options: [full, targeted]
        default: full
      base:
        description: 'Base commit for scope=targeted (leave empty for full validation)'
        required: false

permissions:
  contents: read

# A new push to a pull request cancels the previous run (#413): daily
# development stays fast instead of queueing redundant pipelines.
concurrency:
  # #656: the dispatched measurement runs BOTH policies on one commit, so they
  # must not cancel each other — include the requested scope for dispatches.
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-dispatch-{0}', inputs.scope) || '' }}
  cancel-in-progress: true

jobs:
  # Fast guards that ALWAYS run (pull requests and pushes). No PostgreSQL, no
  # scaffold, no user journey: the heavy battery gates the release instead
  # (#413). These steps must stay cheap enough to run on every commit.
  quality:
    runs-on: ubuntu-latest
    steps:
      # #570 phase A: the affected-scope report needs the PR base commit, so the
      # quality job fetches history (still a single, full pipeline otherwise).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # #570 — affected scope. Documentation/artifact-only PRs skip build+tests
      # (mandatory guards below still run); tests-only PRs build all and run the
      # changed tests; workspace changes stay on FULL validation unless the PR
      # carries the `ci:targeted` label. `ci:full` forces full scope. A detector
      # failure exits 2 (fail closed) instead of narrowing the run, and on
      # non-PR events (push/dispatch) every step defaults to the full pipeline.
      - name: Report affected scope
        id: scope
        # PR runs always report; a dispatched measurement only when asked and
        # only with an explicit base commit (otherwise the scope stays full).
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'targeted' && inputs.base != '')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base }}
          FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') && '1' || '0' }}
          TARGETED: ${{ contains(github.event.pull_request.labels.*.name, 'ci:targeted') && '1' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'targeted' && '1' || '0') }}
        run: |
          node scripts/affected-scope.mjs \
            --base "$BASE_SHA" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json-out "$RUNNER_TEMP/affected-scope.json"
          node scripts/ci/affected-step.mjs \
            --scope "$RUNNER_TEMP/affected-scope.json" \
            --github-output "$GITHUB_OUTPUT" \
            --targeted "${TARGETED:-0}" | tee -a "$GITHUB_STEP_SUMMARY"

      # Repository quality gates (#351) — ALL BLOCK MERGING:
      #   lint       (eslint)  repository source, tests, scripts
      #   typecheck  (tsc)     strict, incl. test files
      #   audit      (OSV.dev) bun.lock vulnerabilities; retries transient
      #                        network errors 3x, then FAILS (never passes
      #                        silently on an unverified dependency tree)
      - name: Lint (eslint)
        run: bun run lint

      - name: Typecheck (tsc)
        run: bun run typecheck

      - name: Dependency audit (OSV)
        run: bun run audit

      # Better Auth ships in generated projects, not in this repo's lockfile,
      # so the repository audit above cannot see it. Resolve the PINNED stack in
      # a scratch project and audit its full closure (#319, #460).
      - name: Better Auth stack audit
        run: |
          RANGE=$(node --input-type=module -e "import { officialBetterAuthRange } from './scripts/better-auth-version.mjs'; console.log(officialBetterAuthRange())")
          AUDIT_DIR="$(mktemp -d)"
          cd "$AUDIT_DIR"
          echo '{ "name": "better-auth-stack-audit", "private": true }' > package.json
          bun add "better-auth@$RANGE" >/dev/null
          cd "$GITHUB_WORKSPACE"
          node scripts/better-auth-audit.mjs "$AUDIT_DIR/bun.lock"

      # Generated-manifest freshness gate (#329): regenerate every manifest on
      # the clean checkout and fail on any diff BEFORE the build step can
      # regenerate over it and hide the drift.
      - name: Check generated manifests freshness
        run: node scripts/check-generated.mjs

      # Full build by default. Scoped builds run the affected workspaces in
      # dependency order (dependencies first) and are opt-in via `ci:targeted`.
      - name: Build packages
        env:
          SCOPE_BUILD: ${{ steps.scope.outputs.build || 'all' }}
          SCOPE_BUILD_DIRS: ${{ steps.scope.outputs.build_dirs }}
          SCOPE_REASON: ${{ steps.scope.outputs.reason }}
        run: |
          if [ "$SCOPE_BUILD" = "none" ]; then
            echo "Skipping package build — ${SCOPE_REASON:-no workspace selected}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$SCOPE_BUILD" = "selected" ]; then
            echo "Building affected workspaces (dependency order): $SCOPE_BUILD_DIRS" | tee -a "$GITHUB_STEP_SUMMARY"
            for dir in $SCOPE_BUILD_DIRS; do
              ( cd "packages/$dir" && bun run build ) || { echo "❌ build failed for packages/$dir"; exit 1; }
            done
            # #656: the inventory guards verify THIS declared build set instead
            # of demanding every workspace (tests/helpers/build-scope.ts).
            echo "SVFORGE_BUILD_WORKSPACES=$SCOPE_BUILD_DIRS" >> "$GITHUB_ENV"
            exit 0
          fi
          bun run --filter '*' build
          echo "SVFORGE_BUILD_WORKSPACES=all" >> "$GITHUB_ENV"

      - name: Run tests
        env:
          SCOPE_TESTS: ${{ steps.scope.outputs.tests || 'all' }}
          SCOPE_TEST_FILES: ${{ steps.scope.outputs.test_files }}
          SCOPE_DEFERRED: ${{ steps.scope.outputs.deferred_test_files }}
          SCOPE_REASON: ${{ steps.scope.outputs.reason }}
        run: |
          if [ -n "$SCOPE_DEFERRED" ]; then
            # #656: cross-cutting guards that cannot be proven safe under a scoped
            # build are NOT skipped — they are deferred to full validation (push
            # to the default branch, ci:full, release), and listed here so the
            # trade-off is auditable on every targeted run.
            echo "Deferring $(echo "$SCOPE_DEFERRED" | wc -w) cross-cutting test file(s) to full validation:" | tee -a "$GITHUB_STEP_SUMMARY"
            for file in $SCOPE_DEFERRED; do echo "  - $file" | tee -a "$GITHUB_STEP_SUMMARY"; done
          fi
          if [ "$SCOPE_TESTS" = "none" ]; then
            echo "Skipping tests — ${SCOPE_REASON:-no test suite selected}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$SCOPE_TESTS" = "selected" ]; then
            echo "Running affected test files: $(echo "$SCOPE_TEST_FILES" | wc -w)" | tee -a "$GITHUB_STEP_SUMMARY"
            bun x vitest run --no-file-parallelism $SCOPE_TEST_FILES
            exit $?
          fi
          bun x vitest run --no-file-parallelism

  # Optional reusable Docker builder (#606). Its only inputs are the pinned
  # lockfile, the dashboard manifest it is generated from, and the Dockerfile,
  # so it runs when one of those changes instead of on every PR. The job builds
  # the image and executes docker/builder-smoke.sh: manifest+lockfile identity,
  # a no-op frozen install, and real Bun imports of the preinstalled stack.
  docker-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Pull requests diff against their base; pushes diff the pushed range
      # (`github.event.before`..`github.sha`). Both paths classify the changed
      # files with scripts/docker-builder-changed.mjs, so a documentation-only
      # push to main or dev does not rebuild the ~1.1 GB image.
      - name: Detect builder inputs
        id: changes
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.base_ref }}"
            git fetch --no-tags origin "+refs/heads/$base:refs/remotes/origin/$base"
            base_ref="origin/$base"
            head_ref="HEAD"
          else
            head_ref="${{ github.sha }}"
            base_ref="${{ github.event.before }}"
            # A brand-new branch reports an all-zero `before`: there is no range
            # to classify, so validate the builder instead of skipping it.
            if ! git cat-file -e "${base_ref}^{commit}" 2>/dev/null; then
              base_ref="$(git rev-parse "${head_ref}^" 2>/dev/null || true)"
            fi
          fi
          if [ -z "$base_ref" ]; then
            changed=true
          else
            changed="$(node scripts/docker-builder-changed.mjs --base "$base_ref" --head "$head_ref")"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Builder inputs changed: $changed"

      - name: Build and smoke the reusable builder image
        if: steps.changes.outputs.changed == 'true'
        run: bash docker/builder-smoke.sh

      # The builder only matters if a real app can build on top of it: prove
      # inherited layers, the app's own lockfile and an independent runtime.
      - name: Validate a consumer build on the builder image
        if: steps.changes.outputs.changed == 'true'
        run: bash docker/consumer-smoke.sh

  # One representative scaffold after a merge to `main` (#413): catches a
  # fundamental composition break between releases without replaying the full
  # matrix on every merge. `base` does not need PostgreSQL.
  main-smoke:
    needs: quality
    # Keep the post-merge smoke visible even if an unrelated quality test fails.
    # !cancelled() waits for quality while allowing this job after its failure.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Scaffold test (base)
        run: bash scripts/test-scaffold.sh base
