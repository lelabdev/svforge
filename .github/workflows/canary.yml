name: Ecosystem Canary

# Weekly drift detector (#205): re-runs the scaffolds against ecosystem
# `latest` versions (sv, Skeleton, SvelteKit) to catch external drift
# BEFORE users do. Unlike the PR CI (#191, pinned), this job is
# informational: a failure opens an issue instead of blocking dev.
#
# The two biggest incidents in this repo were external drift:
# - sv/Kit 2.63 dropped svelte.config.js (#185)
# - Skeleton v5 renamed theme tokens (#194)
# A pinned CI never detects these — this canary does, within 7 days.

# Closing roadmaps: the run cited for "canary ecosystem vert" must be
# POSTERIOR to the last commit of the lot (head_sha >= last commit). Replay
# this workflow on the current main via `gh workflow run canary.yml --ref main`
# and record the tested SHA — an old green canary never validates a newer HEAD.
on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      sv-version:
        description: 'sv CLI version to test (for example 1.1.1; defaults to latest)'
        required: false
        default: latest
        type: string

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scaffold: [base, dashboard, dashboard-playwright, base-blog, base-modules, dashboard-foundations, base-ui-modules, dashboard-integrations]

    # PostgreSQL for the DB scaffolds (#255): the canary would otherwise
    # fail on the real drizzle push even when the ecosystem is healthy.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sf_dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Intentionally floating: this workflow detects upstream drift.
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build all packages
        run: bun run --filter '*' build

      - name: Run tests
        run: bun x vitest run --no-file-parallelism

      - name: Scaffold canary (${{ matrix.scaffold }})
        id: scaffold
        env:
          SV_CMD: "bunx sv@${{ inputs.sv-version || 'latest' }}"
          SV_VERSION: ${{ inputs.sv-version || 'latest' }}
        run: |
          set +e
          bash scripts/test-scaffold.sh ${{ matrix.scaffold }} > /tmp/canary.log 2>&1
          status=$?
          # The external user journey (latest `sv`) runs once from the `base`
          # matrix entry (#465): it exercises the REAL registry install path
          # against the floating ecosystem versions this canary tracks.
          if [ "${{ matrix.scaffold }}" = "base" ] && [ $status -eq 0 ]; then
            {
              echo ""
              echo "--- external user journey (sv@${SV_VERSION}) ---"
            } >> /tmp/canary.log
            bash scripts/test-user-journey.sh >> /tmp/canary.log 2>&1
            status=$?
          fi
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ $status -ne 0 ]; then
            echo "--- last 40 lines ---"
            tail -40 /tmp/canary.log
          fi

      - name: Open or update drift issue on failure
        if: steps.scaffold.outputs.status != '0'
        uses: actions/github-script@v7
        env:
          CANARY_PROFILE: ${{ matrix.scaffold }}
          CANARY_SHA: ${{ github.sha }}
          CANARY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const { canaryFailureSignature, canaryIssueMarker, findExistingCanaryIssue } =
              await import(`${process.env.GITHUB_WORKSPACE}/scripts/canary-issue.mjs`);
            const profile = process.env.CANARY_PROFILE;
            const log = fs.readFileSync('/tmp/canary.log', 'utf-8');
            const signature = canaryFailureSignature(log);
            const marker = canaryIssueMarker(profile, signature);
            const logTail = log.slice(-2000);
            const report = [
              '## Ecosystem drift detected — weekly canary (#205)',
              '',
              `The \`${profile}\` scaffold failed against sv@\`${{ inputs.sv-version || 'latest' }}\` and latest Skeleton/SvelteKit.`,
              '',
              `Failure signature: \`${signature}\``,
              `Commit: \`${process.env.CANARY_SHA}\``,
              `Run: ${process.env.CANARY_RUN_URL}`,
              '',
              'The pinned pull-request CI does not detect this upstream drift; that is the purpose of this canary.',
              '',
              '## Log (tail)',
              '',
              '```',
              logTail,
              '```'
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            const existing = findExistingCanaryIssue(issues, marker);
            if (existing) {
              if (existing.state === 'closed') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'open'
                });
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: report
              });
              core.info(`Updated existing canary issue #${existing.number}.`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Ecosystem drift detected: scaffold ${profile}`,
                body: `${marker}\n\n${report}`
              });
              core.info(`Opened a canary issue for ${profile} (${signature}).`);
            }
