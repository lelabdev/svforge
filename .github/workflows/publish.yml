name: Publish

on:
  # Merging a release PR only stages versions. Publication is manually dispatched.
  workflow_dispatch:
    inputs:
      channel:
        description: Publication channel (explicit release of an already merged Version Packages PR)
        required: true
        type: choice
        options:
          - stable
          - canary
        default: stable
      release_pr:
        description: Merged Version Packages PR number (stable only)
        required: false
        type: number
      confirmation:
        description: Type publish-stable or publish-canary to authorize publication
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Stable npm publications are repository-global and never cancel an active
  # release, including when a workflow is retried.
  group: publish
  queue: max
  cancel-in-progress: false

jobs:
  # Only an explicit, channel-confirmed dispatch from main can publish npm packages.
  # Release PRs must still be merged, bot-authored and immutable (verified below).
  authorize-release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'lelabdev/svforge' &&
      github.ref == 'refs/heads/main' &&
      inputs.channel == 'stable' &&
      inputs.confirmation == 'publish-stable'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_commit: ${{ steps.verify.outputs.release_commit }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - name: Verify reviewed release PR and immutable commit
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.release_pr }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/release-pr.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .merged == true and .base.ref == "main" and
            .title == "Version Packages" and
            .head.ref == "changeset-release/main" and
            .head.repo.full_name == $repo and
            .user.login == "github-actions[bot]"
          ' "$RUNNER_TEMP/release-pr.json" >/dev/null || {
            echo "Not a reviewed merged Changesets release PR" >&2
            exit 1
          }
          COMMIT=$(jq -er '.merge_commit_sha' "$RUNNER_TEMP/release-pr.json")
          HEAD_SHA=$(jq -er '.head.sha' "$RUNNER_TEMP/release-pr.json")
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$COMMIT" origin/main || exit 1
          git show "$COMMIT:.changeset/release-candidates.json" > "$RUNNER_TEMP/candidates.json"
          node -e 'const c=require(process.argv[1]); if (!Array.isArray(c.packages) || !c.packages.length) process.exit(1)' "$RUNNER_TEMP/candidates.json"
          echo "release_commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

  # Full quality battery (#413): the release is the SUPERSET of PR CI. Pull
  # requests only run the fast guards; everything is blocked here before any
  # package is published.
  quality:
    needs: authorize-release
    if: needs.authorize-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.authorize-release.outputs.release_commit }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint (eslint)
        run: bun run lint

      - name: Typecheck (tsc)
        run: bun run typecheck

      # Freshness must be checked BEFORE the scoped waiver below mutates the
      # tracked baseline: the gate regenerates manifests and fails on ANY diff
      # in the clean checkout.
      - name: Check generated manifests freshness
        run: node scripts/check-generated.mjs

      # #615 recovery is pinned to its immutable release commit, whose dev-only
      # @vitest/mocker@5.0.0 acquired two advisories after npm publication.
      # Add ONLY those reviewed exceptions to the historical audit baseline.
      # Ordinary main CI and all other releases keep their normal strict audit.
      - name: Apply scoped audit waivers for historical release 615
        if: needs.authorize-release.outputs.release_commit == '44f726cf4bc45d90ad558b01777bb8335d538f92'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.sha }}"
          git show "${{ github.sha }}:docs/release-615-audit-waivers.json" > "$RUNNER_TEMP/release-615-audit-waivers.json"
          jq -s '.[0] + .[1]' docs/audit-baseline.json "$RUNNER_TEMP/release-615-audit-waivers.json" > "$RUNNER_TEMP/release-615-audit-baseline.json"
          cp "$RUNNER_TEMP/release-615-audit-baseline.json" docs/audit-baseline.json

      - name: Dependency audit (OSV)
        run: bun run audit

      # Better Auth ships in generated projects, not in this repo's lockfile, so
      # the repository audit above cannot see it. Resolve the PINNED stack in a
      # scratch project and audit its full closure (#319, #460).
      - name: Better Auth stack audit
        run: |
          PIN=$(node --input-type=module -e "import { currentPin } from './scripts/better-auth-upgrade.mjs'; console.log(currentPin().version)")
          AUDIT_DIR="$(mktemp -d)"
          cd "$AUDIT_DIR"
          echo '{ "name": "better-auth-stack-audit", "private": true }' > package.json
          bun add "better-auth@$PIN" >/dev/null
          cd "$GITHUB_WORKSPACE"
          node scripts/better-auth-audit.mjs "$AUDIT_DIR/bun.lock"

      - name: Build all packages
        run: bun run --filter '*' build

      - name: Run tests
        run: bun x vitest run --no-file-parallelism

  # Full scaffold matrix (#413): never publish a package whose scaffold cannot
  # build. Runs in parallel — releases are infrequent, so wall-clock time is
  # preferred over total runner minutes. PostgreSQL serves the DB profiles.
  scaffolds:
    needs: authorize-release
    if: needs.authorize-release.result == 'success'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sf_dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        scaffold:
          - base
          - dashboard
          - dashboard-playwright
          - base-blog
          - base-modules
          - dashboard-foundations
          - base-ui-modules
          - dashboard-integrations
          - create-cli
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.authorize-release.outputs.release_commit }}

      # The reviewed 2.2.1 commit lost this executable Git mode in #579.
      # Restore only the file mode for its immutable checkout; the source
      # bytes and approved release versions remain unchanged.
      - name: Restore CLI executable bit for approved release
        run: chmod +x packages/svforge/bin/svforge.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Each matrix runner starts clean and `test-scaffold.sh` only rebuilds
      # `packages/svforge`, so every module dist (blog, dnd, audit, oauth, …)
      # must be built here before the scaffold consumes it (#467 review).
      - name: Build all packages
        run: bun run --filter '*' build

      - name: Scaffold test (${{ matrix.scaffold }})
        run: bash scripts/test-scaffold.sh ${{ matrix.scaffold }}
        env:
          CI: 'true'
          SF_UI_BROWSER_SMOKE: ${{ matrix.scaffold == 'base' }}

  # External user journey from the packed tarball (#462, hardened in #465).
  # PostgreSQL serves the dashboard journey (setup, schema, auth, admin).
  user-journey:
    needs: authorize-release
    if: needs.authorize-release.result == 'success'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sf_dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.authorize-release.outputs.release_commit }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # The golden path packs the CURRENT module packages too, so every dist
      # must exist before `npm pack` runs (#470).
      - name: Build all packages
        run: bun run --filter '*' build

      - name: User journey smoke test (local package, Lefthook)
        run: bash scripts/test-user-journey.sh --hooks lefthook
        env:
          CI: 'true'

      # Golden path pre-publish (#470): ONE `svforge create` command from the
      # packed artifacts (never --dev-root / the checkout). Blocking: a release
      # whose real one-command creator is broken must never be published.
      - name: Golden path (local package)
        run: bash scripts/test-user-journey.sh --path create
        env:
          CI: 'true'

  # The release gate (#413): every validation job must succeed before the first
  # `npm publish`. This job also carries the post-publication signals.
  publish:
    needs: [authorize-release, quality, scaffolds, user-journey]
    if: needs.authorize-release.result == 'success'
    runs-on: ubuntu-latest
    # The published dashboard journey uses a real database, like the pre-publish gate.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sf_dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.authorize-release.outputs.release_commit }}
          fetch-depth: 0

      # The reviewed 2.2.1 commit lost this executable Git mode in #579.
      # Restore only the file mode for its immutable checkout; the source
      # bytes and approved release versions remain unchanged.
      - name: Restore CLI executable bit for approved release
        run: chmod +x packages/svforge/bin/svforge.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # The publish job packs the current build; rebuild it on this runner.
      - name: Build all packages
        run: bun run --filter '*' build

      - name: Verify OIDC publishing runtime
        run: |
          node -e 'const v=process.versions.node.split(".").map(Number); if(v[0]<22 || (v[0]===22 && v[1]<14)) process.exit(1)'
          node -e 'const {execFileSync}=require("node:child_process"); const v=execFileSync("npm",["--version"],{encoding:"utf8"}).trim().split(".").map(Number); if(v[0]<11 || (v[0]===11 && (v[1]<5 || (v[1]===5 && v[2]<1)))) process.exit(1)'
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      # Release artifacts remain pinned to the approved merge commit. The
      # release VALIDATION scripts are updated from the dispatch commit so a
      # reviewed hotfix can unblock a partial release (#617, #620): the 2.2.4
      # recovery failed in the published golden path because this list did not
      # include the journey scripts, so the stale pre-fix copy ran again.
      - name: Load current release validation guards
        run: |
          git fetch --no-tags origin "${{ github.sha }}"
          git show "${{ github.sha }}:scripts/release-plan.mjs" > scripts/release-plan.mjs
          git show "${{ github.sha }}:scripts/compat-manifest.mjs" > scripts/compat-manifest.mjs
          git show "${{ github.sha }}:scripts/npm-consumer-smoke.mjs" > scripts/npm-consumer-smoke.mjs
          # Published user journey + golden path (#462, #470, #617): these run
          # against the released artifacts, not the released validation code.
          git show "${{ github.sha }}:scripts/test-user-journey.sh" > scripts/test-user-journey.sh
          git show "${{ github.sha }}:scripts/user-journey.mjs" > scripts/user-journey.mjs
          chmod +x scripts/test-user-journey.sh

      # The plan is generated before any publication and records the exact
      # commit, independent package versions, registry state, and dependency order.
      - name: Generate release plan
        run: >-
          node scripts/release-plan.mjs
          --check-registry
          --reviewed-candidates .changeset/release-candidates.json
          --commit "${{ needs.authorize-release.outputs.release_commit }}"
          --output /tmp/release-plan.json

      - name: Validate Changesets publication scope
        run: >-
          node scripts/release-candidates.mjs
          --plan /tmp/release-plan.json
          --commit "${{ needs.authorize-release.outputs.release_commit }}"
          --head "${{ needs.authorize-release.outputs.head_sha }}"
          --output /tmp/release-candidates.json

      - name: Show release plan
        run: cat /tmp/release-plan.json

      # Every package is packed and checked before the first npm publish.
      - name: Preflight release tarballs
        run: node scripts/release-plan.mjs --plan /tmp/release-plan.json --preflight

      # This command skips exact versions already in the registry, so rerunning
      # after a partial failure safely resumes the release.
      # Run Changesets directly: npm CLI exchanges the short-lived OIDC
      # credential. The combined Changesets action writes token-based .npmrc.
      - name: Publish with Changesets
        run: bun run changeset:publish
        env:
          npm_config_ignore_scripts: 'true'

      # Consumer gate: install every exact published version and run tsc against
      # generated imports from a clean external project.
      # Registry propagation may lag successful npm publication.
      - name: Consumer installation smoke test
        run: node scripts/npm-consumer-smoke.mjs --plan /tmp/release-plan.json --wait-for-registry

      # Post-publication signal (#462, #465): run the journey against the EXACT
      # `svforge` version from the release plan, not an unpinned `latest`.
      - name: User journey smoke test (published)
        run: |
          VERSION=$(node -e "const plan=require('/tmp/release-plan.json'); const pkg=plan.packages.find((p)=>p.name==='svforge'); if(!pkg) throw new Error('svforge missing from the release plan'); process.stdout.write(pkg.version)")
          echo "Testing published svforge@$VERSION"
          bash scripts/test-user-journey.sh --published "$VERSION"

      # Golden path post-publish (#470): the SAME one-command journey against
      # the exact published version, using the release plan's per-package
      # compatibility manifest (independent module versions) — never `latest`.
      - name: Golden path (published)
        run: |
          VERSION=$(node -e "const plan=require('/tmp/release-plan.json'); const pkg=plan.packages.find((p)=>p.name==='svforge'); if(!pkg) throw new Error('svforge missing from the release plan'); process.stdout.write(pkg.version)")
          node -e "const plan=require('/tmp/release-plan.json'); if(!plan.compatibility) throw new Error('release plan has no compatibility manifest'); require('fs').writeFileSync('/tmp/svforge-compat.json', JSON.stringify(plan.compatibility));"
          echo "Testing published svforge@$VERSION golden path (exact per-package versions)"
          bash scripts/test-user-journey.sh --path create --published "$VERSION" --compat-manifest /tmp/svforge-compat.json

      # Tags and releases are announcements: only finalize after every exact-
      # version consumer check above has passed. This step is safe to rerun.
      - name: Finalize verified package releases
        run: >-
          node scripts/finalize-releases.mjs
          --plan /tmp/release-plan.json
          --candidates /tmp/release-candidates.json
          --commit "${{ needs.authorize-release.outputs.release_commit }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Canary is optional: use the same trusted workflow file but a distinct
  # manual dispatch path and npm dist-tag validation/rollback logic.
  canary:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'lelabdev/svforge' &&
      github.ref == 'refs/heads/main' &&
      inputs.channel == 'canary' &&
      inputs.confirmation == 'publish-canary'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sf_canary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sf_canary_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      # Work only in a disposable archive of the exact source commit. Changesets
      # snapshot versioning, prebuild, and package builds cannot alter this checkout.
      - name: Create isolated snapshot workspace
        run: |
          set -euo pipefail
          snapshot_dir="$RUNNER_TEMP/svforge-canary"
          mkdir -p "$snapshot_dir"
          git archive "${GITHUB_SHA}" | tar -x -C "$snapshot_dir"
          git -C "$snapshot_dir" init -b main
          git -C "$snapshot_dir" config user.email canary-snapshot@localhost
          git -C "$snapshot_dir" config user.name 'SVForge Canary Snapshot'
          git -C "$snapshot_dir" add -A
          git -C "$snapshot_dir" commit -m "Canary source ${GITHUB_SHA}"

      - name: Install snapshot workspace dependencies
        working-directory: ${{ runner.temp }}/svforge-canary
        run: bun install --frozen-lockfile --ignore-scripts

      # Trusted Publishing: no persistent npm credentials and no token-backed .npmrc.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          package-manager-cache: false

      # OIDC dist-tag operations require npm 11.21.0+.
      - name: Setup npm with OIDC dist-tag support
        run: |
          npm install --global npm@11.21.0
          npm --version
          node -e 'const v=require("node:child_process").execFileSync("npm",["--version"],{encoding:"utf8"}).trim().split(".").map(Number); if(v[0]!==11 || v[1]<21) process.exit(1)'
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - name: Check generated manifests before snapshot versioning
        working-directory: ${{ runner.temp }}/svforge-canary
        run: node scripts/check-generated.mjs

      # The full suite includes stable release-plan/changelog assertions. Run it
      # before snapshot versions intentionally diverge from package changelogs.
      - name: Lint source release
        working-directory: ${{ runner.temp }}/svforge-canary
        run: bun run lint

      - name: Typecheck source release
        working-directory: ${{ runner.temp }}/svforge-canary
        run: bun run typecheck

      - name: Dependency audit source release
        working-directory: ${{ runner.temp }}/svforge-canary
        run: bun run audit

      - name: Build source packages before snapshot versioning
        working-directory: ${{ runner.temp }}/svforge-canary
        run: bun run build:all

      - name: Test full repository suite before snapshot versioning
        working-directory: ${{ runner.temp }}/svforge-canary
        run: bun run test

      - name: Prepare immutable Changesets snapshot and exact compatibility manifest
        id: snapshot
        working-directory: ${{ runner.temp }}/svforge-canary
        run: |
          node scripts/canary-snapshots.mjs prepare \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --root "$PWD" \
            --plan "$RUNNER_TEMP/canary-plan.json"

      - name: Validate generated snapshot compatibility manifest
        working-directory: ${{ runner.temp }}/svforge-canary
        run: node scripts/canary-snapshots.mjs validate --root "$PWD" --plan "$RUNNER_TEMP/canary-plan.json"

      - name: Build all snapshot packages
        working-directory: ${{ runner.temp }}/svforge-canary
        run: bun run build:all

      - name: Pre-publish external user journey from packed artifacts
        working-directory: ${{ runner.temp }}/svforge-canary
        run: bash scripts/test-user-journey.sh --path create --template dashboard

      - name: Pack exact snapshot candidates
        id: pack
        working-directory: ${{ runner.temp }}/svforge-canary
        run: >-
          node scripts/canary-artifacts.mjs pack
          --plan "$RUNNER_TEMP/canary-plan.json"
          --root "$PWD"
          --output "$RUNNER_TEMP/canary-tarballs"

      - name: Pre-publish clean consumer install and TypeScript resolution
        working-directory: ${{ runner.temp }}/svforge-canary
        run: node scripts/npm-consumer-smoke.mjs --plan "$RUNNER_TEMP/canary-plan.json"

      # Changesets publishes only packages whose exact snapshot versions are not
      # already present. The per-run staging tag is never `latest` or `canary`.
      - name: Publish immutable snapshots to the per-run staging tag
        id: publish
        working-directory: ${{ runner.temp }}/svforge-canary
        run: bun x changeset publish --tag "canary-run-${GITHUB_RUN_ID}" --no-git-tag
        env:
          npm_config_ignore_scripts: 'true'

      - name: Ensure staging tags exist for retry-skipped snapshot versions
        working-directory: ${{ runner.temp }}/svforge-canary
        run: node scripts/canary-dist-tags.mjs stage --plan "$RUNNER_TEMP/canary-plan.json"

      - name: Post-publish exact-version consumer install
        working-directory: ${{ runner.temp }}/svforge-canary
        run: node scripts/npm-consumer-smoke.mjs --plan "$RUNNER_TEMP/canary-plan.json" --registry-only --wait-for-registry

      - name: Post-publish golden path with exact compatibility versions
        working-directory: ${{ runner.temp }}/svforge-canary
        run: |
          version=$(node -e "const p=require(process.env.PLAN); const x=p.packages.find((pkg)=>pkg.name==='svforge'); if(!x) throw new Error('svforge missing from canary plan'); process.stdout.write(x.version)")
          node -e "const p=require(process.env.PLAN); if(!p.compatibility) throw new Error('canary plan has no compatibility manifest'); require('node:fs').writeFileSync(process.env.COMPAT, JSON.stringify(p.compatibility));"
          bash scripts/test-user-journey.sh --path create --published "$version" \
            --compat-manifest "$RUNNER_TEMP/canary-compat.json" --template dashboard
        env:
          PLAN: ${{ runner.temp }}/canary-plan.json
          COMPAT: ${{ runner.temp }}/canary-compat.json

      # Only validated packages receive the public `canary` tag. The script
      # restores each previous tag if promotion partially fails.
      - name: Promote validated snapshots to the canary dist-tag
        id: promote
        working-directory: ${{ runner.temp }}/svforge-canary
        run: node scripts/canary-dist-tags.mjs promote --plan "$RUNNER_TEMP/canary-plan.json"

      - name: Remove per-run staging dist-tags
        if: ${{ always() && steps.promote.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/svforge-canary
        run: node scripts/canary-dist-tags.mjs cleanup --plan "$RUNNER_TEMP/canary-plan.json"
