name: Publish

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Publishing is repository-global: prod pushes and manual dispatches must
  # never publish concurrently, even when they use different refs.
  group: publish
  cancel-in-progress: false

jobs:
  publish-latest:
    runs-on: ubuntu-latest

    # PostgreSQL for the real DB scaffold gate (#255/#256)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sf_dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Generated-manifest freshness gate (#329): a stale committed manifest
      # must fail before anything is built, tested, or published.
      - name: Check generated manifests freshness
        run: node scripts/check-generated.mjs

      - name: Build all packages
        run: bun run --filter '*' build

      - name: Run tests
        run: bun x vitest run

      # Scaffold gate (#191): never publish a package whose scaffold cannot build
      - name: Scaffold test (base)
        run: bash scripts/test-scaffold.sh base

      - name: Scaffold test (dashboard)
        run: bash scripts/test-scaffold.sh dashboard

      # Composition gate (#258): the new foundations must keep composing
      # against real PostgreSQL before any package is published.
      - name: Scaffold test (dashboard-foundations)
        run: bash scripts/test-scaffold.sh dashboard-foundations
        env:
          CI: 'true'

      # Consumer coverage gate (#284): historical modules must compile inside
      # real consumer scaffolds before any package is published.
      - name: Scaffold test (base-ui-modules)
        run: bash scripts/test-scaffold.sh base-ui-modules

      - name: Scaffold test (dashboard-integrations)
        run: bash scripts/test-scaffold.sh dashboard-integrations
        env:
          CI: 'true'

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The plan is generated before any publication and records the exact
      # commit, independent package versions, registry state, and dependency order.
      - name: Generate release plan
        run: node scripts/release-plan.mjs --check-registry --output /tmp/release-plan.json

      - name: Verify package publish access
        run: node scripts/release-plan.mjs --plan /tmp/release-plan.json --check-access
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Show release plan
        run: cat /tmp/release-plan.json

      # Every package is packed and checked before the first npm publish.
      - name: Preflight release tarballs
        run: node scripts/release-plan.mjs --plan /tmp/release-plan.json --preflight
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Published user journey (#462): pack the current build, then run the real
      # external path (install tarball → sv create → sv add → setup → server →
      # minimal journey) from a clean temporary directory. No monorepo import
      # and no `--dev-root`, so a file missing from the npm artifact fails here
      # BEFORE anything is published.
      - name: User journey smoke test (local package)
        run: bash scripts/test-user-journey.sh

      # This command skips exact versions already in the registry, so rerunning
      # after a partial failure safely resumes the release.
      - name: Publish release plan
        run: node scripts/release-plan.mjs --plan /tmp/release-plan.json --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Consumer gate: install every exact published version and run tsc against
      # generated imports from a clean external project.
      - name: Consumer installation smoke test
        run: node scripts/npm-consumer-smoke.mjs --plan /tmp/release-plan.json

      # Post-publication signal (#462): the journey now runs against the real
      # npm package, from a clean temporary directory, exactly as documented.
      - name: User journey smoke test (published)
        run: bash scripts/test-user-journey.sh --published
